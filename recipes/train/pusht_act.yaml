schema_version: rlw.recipe/v1
name: pusht_act_baseline
kind: train
provider: lerobot
policy_type: act
dataset_repo_id: lerobot/pusht
native_overrides:
  steps: 25000
  batch_size: 8
  save_freq: 5000
  save_checkpoint: true
  env_eval_freq: 0
  eval_steps: 0
  wandb.enable: false
notes: >-
  V0 golden path. RLW injects an immutable dataset revision and a run-scoped
  output_dir, then delegates training to LeRobot without reimplementing it.
